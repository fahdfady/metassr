[package]
name = "metassr-devtools"
version.workspace = true
edition = "2021"
description = "Dev-mode browser tooling for MetaSSR: live-reload client and error overlay"

[dependencies]
axum = "0.7.5"
futures-util = "0.3.31"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.122"
tokio = { version = "1.36.0", features = ["full"] }
tokio-tungstenite = "0.26.2"
tracing = "0.1.40"

[dev-dependencies]
tower-service = "0.3.3"
